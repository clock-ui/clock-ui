name: Bug report
description: Something renders wrong, drifts, or crashes.
labels: [bug]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - "@clock-ui/react"
        - "@clock-ui/vue"
        - "@clock-ui/dom"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: framework
    attributes:
      label: Framework version
      placeholder: "React 18.3.1 / Vue 3.5.24 / n/a"
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: A screenshot or GIF helps enormously for anything visual.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: A link to a minimal repro, or the props you passed.
