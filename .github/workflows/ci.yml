name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      # Catches broken export maps and mis-pointed type declarations, which is
      # how the published packages previously shipped a CJS .d.cts as the only
      # type entry.
      - name: Lint package manifests
        run: |
          for pkg in dom react vue; do
            (cd "packages/$pkg" && bunx publint --strict)
          done

      # Loads a real production bundle into a DOM and asserts clocks appear.
      # Unit tests import from src and dev servers do not tree-shake, so
      # neither catches a package that builds cleanly but renders nothing once
      # a consumer bundles it — which is how a stale sideEffects field once
      # deleted the custom element from every production build.
      - name: Smoke test the built example
        run: bun run smoke
