version: 2
updates:
  # This repo installs with Bun and has no npm or yarn lockfile. The npm
  # ecosystem does not know bun.lock exists, so it bumps package.json and
  # leaves the lockfile behind — every such pull request then fails CI on
  # `bun install --frozen-lockfile` and cannot be merged as opened.
  #
  # The bun ecosystem regenerates bun.lock alongside package.json. It requires
  # the text-based lockfile, which this repo uses.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # TypeScript 7 is the native rewrite. Its exports map no longer provides
      # "./lib/tsc" — the compiler ships as a platform binary — and vue-tsc
      # resolves exactly that path to wrap the JS compiler, so it throws
      # ERR_PACKAGE_PATH_NOT_EXPORTED before typechecking anything.
      #
      # vue-tsc still declares `typescript: ">=5.0.0"`, which predates 7 and is
      # too permissive, so nothing stops the combination installing.
      #
      # Remove this once vue-tsc supports the native distribution. Only the Vue
      # package is affected; everything else uses plain tsc.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

      # tsdown 0.23 replaces unplugin-lightningcss with @tsdown/css. Attempted
      # and reverted — it breaks four things at once:
      #
      #   1. The Vue package stops building. tsdown's dts plugin cannot handle
      #      SFCs, failing with "this.fileExists is not a function" and
      #      "'default' is not exported by src/BaseClock.vue.d.ts". Output drops
      #      to index.cjs and a stylesheet: no ESM, no type declarations.
      #   2. CSS is no longer minified. That was lightningcss's job, and
      #      tsdown's own `minify` does not cover it — 5,637 to 6,598 bytes.
      #   3. The emitted stylesheet is renamed index.css to style.css, which
      #      breaks exports["./base.css"] in all three packages and every
      #      published CDN link in the docs.
      #   4. element.css is no longer emitted, so the custom element's CDN
      #      example would 404.
      #
      # (1) is upstream and blocks the rest. Re-test that first when revisiting;
      # if the Vue package builds with types, the other three are config work.
      #
      # Note the update-types: tsdown is pre-1.0, so 0.16 to 0.23 is a semver
      # *minor*. Ignoring majors alone does nothing here — that would only
      # catch an eventual 1.0.
      - dependency-name: tsdown
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

      # Same pre-1.0 reasoning: this is tsdown's CSS plugin and has to move
      # with it, and tsdown 0.23 drops it entirely in favour of @tsdown/css.
      - dependency-name: unplugin-lightningcss
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

      # vue-tsc 3.3 breaks the Vue package's declaration build:
      #
      #   [rolldown-plugin-dts:generate]
      #   TypeError: this.ts.findConfigFile is not a function
      #
      # tsdown generates Vue declarations through rolldown-plugin-dts, which
      # delegates to @vue/language-core — pinned by whichever vue-tsc is
      # installed. 3.3 changed an internal the plugin relies on.
      #
      # Isolated by bumping each separately: tsdown 0.16.8 alone builds fine,
      # and adding vue-tsc 3.3.11 is what breaks it. So this is vue-tsc, not
      # tsdown, despite the error surfacing inside a tsdown plugin.
      #
      # 3.1.x patches still flow.
      - dependency-name: vue-tsc
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
